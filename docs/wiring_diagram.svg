<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="unoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="tofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="ledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Filters for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="pinGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="960" height="560" fill="url(#bgGrad)" />
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" />
    </pattern>
    <rect width="960" height="560" fill="url(#grid)" />
  </g>

  <!-- Title & Header Badge -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="880" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#0284c7" />
    <path d="M 23 28 L 27 32 L 34 23" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="54" y="27" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="-0.01em">Принципиальная схема соединений: Arduino Uno + VL53L0X + KY-016</text>
    <text x="54" y="44" fill="#94a3b8" font-size="12">Лазерный дальномер ToF I2C + RGB индикация стробирования / фильтра Калмана</text>
    <rect x="760" y="16" width="104" height="24" rx="12" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <text x="812" y="32" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">5V / I2C Bus</text>
  </g>

  <!-- ==================== WIRES / TRACKS ==================== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Wire 1: 5V Power (Red) [Arduino 5V (260, 400) -> VL53L0X VIN (140, 245)] -->
    <path d="M 260 395 L 260 350 L 140 350 L 140 245" stroke="#ef4444" stroke-width="3.5" />
    
    <!-- Wire 2: GND Common to Sensor (Black) [Arduino GND (300, 395) -> VL53L0X GND (165, 245)] -->
    <path d="M 300 395 L 300 330 L 165 330 L 165 245" stroke="#64748b" stroke-width="3" stroke-dasharray="6,2" />
    
    <!-- Wire 3: SDA Blue (A4 (410, 395) -> VL53L0X SDA (215, 245)) -->
    <path d="M 410 395 L 410 310 L 215 310 L 215 245" stroke="#38bdf8" stroke-width="3.5" />

    <!-- Wire 4: SCL Yellow (A5 (440, 395) -> VL53L0X SCL (190, 245)) -->
    <path d="M 440 395 L 440 290 L 190 290 L 190 245" stroke="#facc15" stroke-width="3.5" />

    <!-- Wire 5: GND to KY-016 (Black) [Arduino GND (320, 395) -> KY-016 - (780, 245)] -->
    <path d="M 320 395 L 320 330 L 780 330 L 780 245" stroke="#64748b" stroke-width="3" stroke-dasharray="6,2" />

    <!-- Wire 6: Pin 9 to KY-016 R (Orange) [Arduino D9 (570, 395) -> KY-016 R (805, 245)] -->
    <path d="M 570 395 L 570 310 L 805 310 L 805 245" stroke="#f97316" stroke-width="3.5" />

    <!-- Wire 7: Pin 10 to KY-016 G (Emerald) [Arduino D10 (600, 395) -> KY-016 G (830, 245)] -->
    <path d="M 600 395 L 600 290 L 830 290 L 830 245" stroke="#10b981" stroke-width="3.5" />
  </g>

  <!-- Wire Labels (Callouts) -->
  <g font-size="10" font-weight="600" text-anchor="middle">
    <!-- 5V Callout -->
    <rect x="180" y="342" width="46" height="16" rx="4" fill="#ef4444" />
    <text x="203" y="354" fill="#ffffff">+5V</text>

    <!-- GND Callout Left -->
    <rect x="210" y="322" width="46" height="16" rx="4" fill="#334155" stroke="#64748b" stroke-width="1" />
    <text x="233" y="334" fill="#f8fafc">GND</text>

    <!-- SDA Callout -->
    <rect x="290" y="302" width="48" height="16" rx="4" fill="#0284c7" />
    <text x="314" y="314" fill="#ffffff">SDA (A4)</text>

    <!-- SCL Callout -->
    <rect x="290" y="282" width="48" height="16" rx="4" fill="#ca8a04" />
    <text x="314" y="294" fill="#ffffff">SCL (A5)</text>

    <!-- D9 Outlier Callout -->
    <rect x="660" y="302" width="76" height="16" rx="4" fill="#c2410c" />
    <text x="698" y="314" fill="#ffffff">Pin 9 (Red LED)</text>

    <!-- D10 Normal Callout -->
    <rect x="660" y="282" width="84" height="16" rx="4" fill="#047857" />
    <text x="702" y="294" fill="#ffffff">Pin 10 (Green LED)</text>
  </g>

  <!-- ==================== DEVICE 1: VL53L0X ==================== -->
  <g transform="translate(100, 110)" filter="url(#glow)">
    <!-- Board Base -->
    <rect x="0" y="0" width="160" height="135" rx="10" fill="url(#tofGrad)" stroke="#a78bfa" stroke-width="1.5" />
    
    <!-- Sensor IC Aperture -->
    <rect x="45" y="22" width="70" height="36" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <circle cx="63" cy="40" r="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5" />
    <circle cx="63" cy="40" r="3" fill="#ef4444" />
    <circle cx="97" cy="40" r="8" fill="#172554" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="97" cy="40" r="3" fill="#3b82f6" />
    <text x="80" y="72" fill="#e2e8f0" font-size="11" font-weight="700" text-anchor="middle">VL53L0X ToF</text>
    <text x="80" y="85" fill="#c4b5fd" font-size="9" text-anchor="middle">Лазерный дальномер</text>

    <!-- Pins at Bottom: VIN, GND, SCL, SDA, XSHUT, GPIO1 -->
    <!-- Pins positions relative: x=40, 65, 90, 115 -->
    <!-- VIN -->
    <circle cx="40" cy="135" r="5" fill="#facc15" stroke="#000000" stroke-width="1" />
    <text x="40" y="125" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">VIN</text>

    <!-- GND -->
    <circle cx="65" cy="135" r="5" fill="#facc15" stroke="#000000" stroke-width="1" />
    <text x="65" y="125" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">GND</text>

    <!-- SCL -->
    <circle cx="90" cy="135" r="5" fill="#facc15" stroke="#000000" stroke-width="1" />
    <text x="90" y="125" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">SCL</text>

    <!-- SDA -->
    <circle cx="115" cy="135" r="5" fill="#facc15" stroke="#000000" stroke-width="1" />
    <text x="115" y="125" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">SDA</text>
  </g>

  <!-- ==================== DEVICE 2: KY-016 RGB LED ==================== -->
  <g transform="translate(740, 110)" filter="url(#glow)">
    <!-- Board Base -->
    <rect x="0" y="0" width="140" height="135" rx="10" fill="url(#ledGrad)" stroke="#34d399" stroke-width="1.5" />

    <!-- 5mm RGB LED Bulb -->
    <circle cx="70" cy="42" r="22" fill="#ffffff" fill-opacity="0.85" stroke="#e2e8f0" stroke-width="2" />
    <!-- Inner Cathode Anode Leads inside LED -->
    <rect x="64" y="32" width="4" height="14" fill="#94a3b8" />
    <rect x="72" y="30" width="5" height="16" fill="#64748b" />
    <text x="70" y="78" fill="#f0fdf4" font-size="11" font-weight="700" text-anchor="middle">KY-016 RGB</text>
    <text x="70" y="90" fill="#a7f3d0" font-size="9" text-anchor="middle">Светодиод (Катод)</text>

    <!-- Pins at Bottom: -, R, G, B -->
    <!-- - (GND) -->
    <circle cx="40" cy="135" r="5" fill="#facc15" stroke="#000000" stroke-width="1" />
    <text x="40" y="125" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">-</text>

    <!-- R (Red) -->
    <circle cx="65" cy="135" r="5" fill="#facc15" stroke="#000000" stroke-width="1" />
    <text x="65" y="125" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">R</text>

    <!-- G (Green) -->
    <circle cx="90" cy="135" r="5" fill="#facc15" stroke="#000000" stroke-width="1" />
    <text x="90" y="125" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">G</text>

    <!-- B (Blue - NC) -->
    <circle cx="115" cy="135" r="4" fill="#475569" stroke="#1e293b" stroke-width="1" />
    <text x="115" y="125" fill="#94a3b8" font-size="8" text-anchor="middle">B(NC)</text>
  </g>

  <!-- ==================== DEVICE 3: ARDUINO UNO ==================== -->
  <g transform="translate(200, 380)" filter="url(#glow)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="540" height="150" rx="10" fill="url(#unoGrad)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- USB Type-B Port -->
    <rect x="-15" y="35" width="30" height="40" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1" />
    <rect x="-10" y="43" width="10" height="24" fill="#334155" />

    <!-- DC Barrel Jack -->
    <rect x="-15" y="95" width="35" height="35" rx="3" fill="#1e293b" stroke="#000000" stroke-width="1" />

    <!-- Microcontroller Chip (ATmega328P DIP) -->
    <rect x="220" y="60" width="150" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="230" cy="82" r="3" fill="#334155" />
    <text x="295" y="86" fill="#94a3b8" font-size="10" font-family="monospace" font-weight="700" letter-spacing="1">ATmega328P</text>

    <!-- Crystal Oscillator 16MHz -->
    <rect x="180" y="70" width="22" height="14" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
    <text x="191" y="80" fill="#475569" font-size="7" font-weight="700" text-anchor="middle">16.0</text>

    <!-- Arduino Uno Label -->
    <text x="90" y="45" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.05em">ARDUINO</text>
    <text x="185" y="45" fill="#38bdf8" font-size="15" font-weight="700">UNO</text>
    <text x="90" y="60" fill="#bae6fd" font-size="9">Микроконтроллерная плата (R3)</text>

    <!-- Pin Headers Top Row: Power & Analog & Digital -->
    <!-- Pins used: 5V (x=60), GND (x=100), GND (x=120), A4 (x=210), A5 (x=240), D9 (x=370), D10 (x=400) -->

    <!-- Header Strip Background -->
    <rect x="40" y="5" width="460" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1" />

    <!-- Pin 5V -->
    <g transform="translate(60, 14)">
      <circle cx="0" cy="0" r="5" fill="#facc15" stroke="#dc2626" stroke-width="1.5" />
      <text x="0" y="-10" fill="#ef4444" font-size="9" font-weight="700" text-anchor="middle">5V</text>
    </g>

    <!-- Pin GND 1 -->
    <g transform="translate(100, 14)">
      <circle cx="0" cy="0" r="5" fill="#facc15" stroke="#475569" stroke-width="1.5" />
      <text x="0" y="-10" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">GND</text>
    </g>

    <!-- Pin GND 2 -->
    <g transform="translate(120, 14)">
      <circle cx="0" cy="0" r="5" fill="#facc15" stroke="#475569" stroke-width="1.5" />
      <text x="0" y="-10" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">GND</text>
    </g>

    <!-- Pin A4 (SDA) -->
    <g transform="translate(210, 14)">
      <circle cx="0" cy="0" r="5" fill="#facc15" stroke="#0284c7" stroke-width="1.5" />
      <text x="0" y="-10" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">A4</text>
    </g>

    <!-- Pin A5 (SCL) -->
    <g transform="translate(240, 14)">
      <circle cx="0" cy="0" r="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
      <text x="0" y="-10" fill="#facc15" font-size="9" font-weight="700" text-anchor="middle">A5</text>
    </g>

    <!-- Pin D9 (Outlier / Red) -->
    <g transform="translate(370, 14)">
      <circle cx="0" cy="0" r="5" fill="#facc15" stroke="#ea580c" stroke-width="1.5" />
      <text x="0" y="-10" fill="#fb923c" font-size="9" font-weight="700" text-anchor="middle">D9</text>
    </g>

    <!-- Pin D10 (Norm / Green) -->
    <g transform="translate(400, 14)">
      <circle cx="0" cy="0" r="5" fill="#facc15" stroke="#059669" stroke-width="1.5" />
      <text x="0" y="-10" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">D10</text>
    </g>

    <!-- Inactive decorative pins -->
    <circle cx="150" cy="14" r="3" fill="#475569" />
    <circle cx="170" cy="14" r="3" fill="#475569" />
    <circle cx="310" cy="14" r="3" fill="#475569" />
    <circle cx="340" cy="14" r="3" fill="#475569" />
    <circle cx="430" cy="14" r="3" fill="#475569" />
    <circle cx="460" cy="14" r="3" fill="#475569" />

    <!-- Status indicator LED on Arduino -->
    <circle cx="100" cy="80" r="4" fill="#22c55e" />
    <text x="110" y="83" fill="#86efac" font-size="8" font-family="monospace">ON</text>
    <circle cx="100" cy="98" r="4" fill="#eab308" />
    <text x="110" y="101" fill="#fde047" font-size="8" font-family="monospace">L (Pin13)</text>
  </g>

  <!-- Legend Box at Bottom Right -->
  <g transform="translate(710, 395)">
    <rect x="0" y="0" width="210" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#f1f5f9" font-size="11" font-weight="700">Обозначение сигналов</text>
    
    <circle cx="20" cy="38" r="4" fill="#ef4444" />
    <text x="32" y="41" fill="#e2e8f0" font-size="10">Питание +5V</text>

    <circle cx="20" cy="56" r="4" fill="#64748b" />
    <text x="32" y="59" fill="#e2e8f0" font-size="10">Земля (GND / Общий)</text>

    <circle cx="20" cy="74" r="4" fill="#38bdf8" />
    <text x="32" y="77" fill="#e2e8f0" font-size="10">I2C SDA (Шина данных)</text>

    <circle cx="20" cy="92" r="4" fill="#facc15" />
    <text x="32" y="95" fill="#e2e8f0" font-size="10">I2C SCL (Шина тактов)</text>

    <circle cx="20" cy="110" r="4" fill="#f97316" />
    <text x="32" y="113" fill="#e2e8f0" font-size="10">D9: Выброс / Аномалия</text>

    <circle cx="125" cy="110" r="4" fill="#10b981" />
    <text x="137" y="113" fill="#e2e8f0" font-size="10">D10: Норма</text>
  </g>
</svg>
